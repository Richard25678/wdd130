<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wild River Rafting Co. | Contact Us</title>

    <meta name="description"
      content="Contact Wild River Rafting Co. for rafting reservations, questions, and website suggestions.">

    <meta name="author" content="Muwonge Richard">

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header class="site-header">
        <img src="images/rafting-logo.png" alt="Wild River Rafting Co. logo">

        <nav class="primary-nav" aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <h1>Contact Us</h1>

        <section class="company-info">
            <h2>Wild River Rafting Co.</h2>

            <p>
                <strong>Address:</strong>
                123 River Road, Kampala, Uganda
            </p>

            <p>
                <strong>Phone:</strong>
                +256 700 123456
            </p>

            <p>
                <strong>Email:</strong>
                info@wildriverrafting.com
            </p>
        </section>

        <div class="contact-layout">

            <section class="map">
                <h2>Our Location</h2>

                <iframe src="https://www.google.com/maps?q=Kampala%2C%20Uganda&output=embed"
                  width="400" height="300" loading="lazy"
                  title="Map showing Wild River Rafting Co. location">
                </iframe>
            </section>

            <section class="contact-form">
                <h2>Get in Touch!</h2>

                <form action="#" method="get">

                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Your name" required>

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Your email address"
                      required>

                    <fieldset>
                        <legend>What is the purpose of your message?</legend>

                        <label for="general">
                            <input type="radio" id="general" name="purpose" value="general"
                              required>
                            General Inquiry
                        </label>

                        <label for="reservation">
                            <input type="radio" id="reservation" name="purpose" value="reservation">
                            Reservation Question
                        </label>

                        <label for="suggestion">
                            <input type="radio" id="suggestion" name="purpose" value="suggestion">
                            Website Suggestion
                        </label>
                    </fieldset>

                    <label for="message">Message</label>

                    <textarea id="message" name="message" rows="6"
                      placeholder="Type your message here..." required></textarea>

                    <label for="newsletter">
                        <input type="checkbox" id="newsletter" name="newsletter">
                        Please subscribe me to the monthly newsletter
                    </label>

                    <button type="submit">Send Message</button>

                </form>
            </section>

        </div>

        <section class="employee-profiles">
            <h2>Meet Our Team</h2>

            <div class="employee-grid">

                <figure>
                    <img src="images/lead.jpg" alt="Muwonge Richard, Lead Rafting Guide">
                    <figcaption>
                        Muwonge Richard — Lead Rafting Guide
                    </figcaption>
                </figure>

                <figure>
                    <img src="images/sarah.jpg" alt="Sarah, Safety Manager">
                    <figcaption>
                        Sarah — Safety Manager
                    </figcaption>
                </figure>

                <figure>
                    <img src="images/daniel.jpg" alt="Daniel, Trip Coordinator">
                    <figcaption>
                        Daniel — Trip Coordinator
                    </figcaption>
                </figure>

            </div>
        </section>

    </main>

    <footer>
        <p>
            &copy; 2026 Wild River Rafting Co. — Muwonge Richard
        </p>

        <nav class="socialmedia" aria-label="Social media links">

            <a href="https://www.facebook.com" target="_blank" rel="noopener noreferrer">
                <img src="images/facebook.png" alt="Wild River Rafting Facebook page">
            </a>

            <a href="https://www.instagram.com" target="_blank" rel="noopener noreferrer">
                <img src="images/instagram.jpg" alt="Wild River Rafting Instagram page">
            </a>

            <a href="https://x.com" target="_blank" rel="noopener noreferrer">
                <img src="images/twitter.png" alt="Wild River Rafting X page">
            </a>

        </nav>
    </footer>

</body>

</html>
